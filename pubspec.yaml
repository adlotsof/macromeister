name: macrotrack
description: "Feature-equivalent nutrition & macro tracker (local-only clone of a commercial app's feature set)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  # Local data
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  # UI/util
  intl: ^0.20.1
  fl_chart: ^0.70.2
  go_router: ^14.6.2
  share_plus: ^13.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  # Barcode scanning (MLKit-backed, like the original)
  mobile_scanner: ^7.5.0
  # Health integration (Health Connect on Android)
  health: ^13.3.2
  http: ^1.2.0
  file_picker: ^13.4.0
  excel: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/foods_off.db
    - assets/foods_common.db
