name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The two bundled food databases are built from public datasets on every
      # run; the raw downloads (~1.5 GB OFF + ~60 MB USDA) are cached by day.
      - name: Cache raw food datasets
        uses: actions/cache@v4
        with:
          path: tools/
          key: food-data-${{ github.event.head_commit.timestamp || github.run_id }}
          restore-keys: |
            food-data-

      - name: Build food databases
        run: ./tools/fetch_food_data.sh

      - name: Verify bundled databases exist
        run: |
          test -s assets/foods_off.db
          test -s assets/foods_common.db
          ls -la assets/*.db

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macrotrack-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
