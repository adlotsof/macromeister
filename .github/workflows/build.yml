name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR instead of queueing them.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit & widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.50.0 # pin: releases must not ride untested Flutter patch bumps
          cache: true

      - run: flutter pub get

      # The bundled food DBs are built in the build job; the analyzer only
      # needs the files declared in pubspec.yaml to exist.
      - name: Stub bundled food databases
        run: mkdir -p assets && touch assets/foods_off.db assets/foods_common.db

      - name: Check food-DB builder schema/row arity
        run: python3 tools/check_builder_arity.py

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  ios-build:
    # Compile validation for the iOS port: simulator build, no signing.
    # App Store/TestFlight release needs an Apple Developer account +
    # App Store Connect API key — follow-up once the user provides one.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.50.0 # pin: releases must not ride untested Flutter patch bumps
          cache: true

      - run: flutter pub get

      # CI only validates compilation; the real food DBs are built for release.
      - name: Stub bundled food databases
        run: mkdir -p assets && touch assets/foods_off.db assets/foods_common.db

      - name: Build iOS (simulator, unsigned)
        run: flutter build ios --simulator --no-codesign

  build:
    # PRs get the test job only — the ~30 min APK build is not review feedback.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Runner images ship ~15 GB of preinstalled toolchains we don't need
      # (dotnet, Haskell, CodeQL, Docker images, extra toolcache). The food-DB
      # build alone needs ~2.5 GB (1.5 GB OFF dump + DB) and the Flutter/Android
      # build several more, so without this the merge step dies with
      # "No space left on device". Android SDK is kept — the app needs it.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
            /usr/local/share/chrome /usr/local/share/chromium \
            /usr/local/share/powershell /etc/mysql /etc/php
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "free after cleanup:"; df -h / | tail -1

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.50.0 # pin: releases must not ride untested Flutter patch bumps
          cache: true

      # The two bundled food databases are built from public datasets on every
      # run (~1.5 GB OFF + ~60 MB USDA). Raw datasets are NOT cached — caching
      # would pin ~1.5 GB on the runner for the whole job and the APK asset
      # merge previously died with "No space left on device".
      - name: Build food databases
        run: ./tools/fetch_food_data.sh

      - name: Remove raw food datasets
        run: rm -f tools/*.csv tools/*.csv.gz tools/fndds/*.csv

      - name: Verify bundled databases exist
        run: |
          test -s assets/foods_off.db
          test -s assets/foods_common.db
          ls -la assets/*.db

      - run: flutter pub get

      # health 13.x still applies 'kotlin-android', which fails under AGP 9
      # with built-in Kotlin (android.builtInKotlin=true). Patch the pub-cache
      # copy of the plugin; pub cache is clean on every CI run.
      - name: Patch Flutter Gradle toolchain plugin repositories
        run: chmod +x tools/patch_flutter_gradle_repos.sh && ./tools/patch_flutter_gradle_repos.sh

      - name: Patch health plugin for built-in Kotlin
        run: chmod +x tools/patch_health_plugin.sh && ./tools/patch_health_plugin.sh

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macrotrack-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

# NOTE: releasing happens in .github/workflows/release.yml, triggered by
# workflow_run on this workflow's successful main runs (a GITHUB_TOKEN push
# cannot trigger another workflow, so tagging from here would be a no-op).
