name: release

# Every successful build on main (i.e. every merge that passed test+build)
# is released: a version tag is created, a signed AAB + APK are built, the
# APK is attached to a GitHub Release and the AAB is uploaded to the Google
# Play INTERNAL track.
#
# NOTE: triggered via workflow_run because pushes made with GITHUB_TOKEN
# (e.g. the tag job's) do not trigger other workflows. Manual tag pushes
# still work too.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore
#                             (base64 -i macrotrack-release.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD keystore store password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
#   PLAY_SERVICE_ACCOUNT_JSON full contents of the Play Console service
#                             account JSON (API access granted, internal track)
#
# If the Play secrets are missing the job still builds, tags and publishes
# the GitHub Release but skips the Play upload.

on:
  workflow_run:
    workflows: ['build']
    types: [completed]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Expose secret presence to step-level `if:` conditions.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Resolve commit to release
        id: rev
        run: |
          # workflow_run events arrive after the triggering run finished; a
          # newer main push may already exist — release exactly the commit
          # that was built and tested.
          if [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.rev.outputs.sha }}

      - name: Create version tag (base from pubspec + run number)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            BASE="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)"
            TAG="v${BASE}+${RUN_NUMBER}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists"
          else
            git tag -a "$TAG" -m "Auto release (run ${RUN_NUMBER})"
            git push origin "$TAG"
          fi
        id: tag

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
            /usr/local/share/chrome /usr/local/share/chromium \
            /usr/local/share/powershell /etc/mysql /etc/php
          sudo docker image prune -af >/dev/null 2>&1 || true

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Build food databases
        run: ./tools/fetch_food_data.sh

      - name: Remove raw food datasets
        run: rm -f tools/*.csv tools/*.csv.gz tools/fndds/*.csv

      - name: Patch health plugin for built-in Kotlin
        run: chmod +x tools/patch_health_plugin.sh && ./tools/patch_health_plugin.sh

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/macrotrack-release.jks
          {
            echo 'storeFile=macrotrack-release.jks'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      # AAB for Play, APK for direct GitHub download. The build number is the
      # workflow run number so every upload carries a unique versionCode
      # (Google Play rejects reused ones).
      - name: Build signed app bundle
        run: flutter build appbundle --release --build-number="${{ github.run_number }}"

      - name: Build release APK
        run: flutter build apk --release --build-number="${{ github.run_number }}"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload to Play internal track
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.trsonn.macrotrack
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
