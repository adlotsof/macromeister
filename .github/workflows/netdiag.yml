name: netdiag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Maven Central / portal from runner
        run: |
          for url in \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.3.20/kotlin-stdlib-2.3.20.pom \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.3.20/kotlin-stdlib-2.3.20.pom \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/kotlin-stdlib/2.3.20/kotlin-stdlib-2.3.20.pom ; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
            echo "$code $url"
          done
      - name: Gradle resolve kotlin-stdlib 2.3.20 (clean cache)
        run: |
          mkdir -p /tmp/gradtest && cd /tmp/gradtest
          gradle_num=$(curl -s https://services.gradle.org/versions/current | grep -o '"version" *: *"[^"]*"' | grep -oE '[0-9.]+[0-9]')
          echo "runner gradle dist (installed): $(gradle --version 2>/dev/null | grep Gradle || echo none)"
          cat > settings.gradle.kts <<'EOS'
          pluginManagement { repositories { gradlePluginPortal(); mavenCentral(); google() } }
          EOS
          cat > build.gradle.kts <<'EOS'
          buildscript {
            repositories { gradlePluginPortal(); mavenCentral(); google() }
            dependencies { classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20") }
          }
          EOS
          gradle help --no-daemon 2>&1 | tail -15 || true
