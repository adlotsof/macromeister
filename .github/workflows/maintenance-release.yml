name: maintenance-release

# Google Play requires at least one app update per ~6 months or the account
# can be disabled. This runs on Jan 1 and Jul 1 (and on demand), bumps the
# build number and pushes a fresh build to the Play INTERNAL track. It also
# creates a tag so the regular release workflow attaches the APK to GitHub.
#
# Required secrets: ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/
# ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON,
# plus a default GITHUB_TOKEN with contents:write (workflow sets it).

on:
  schedule:
    # 09:00 UTC on Jan 1 and Jul 1
    - cron: '0 9 1 1,7 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maintenance-release
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
            /usr/local/share/chrome /usr/local/share/chromium \
            /usr/local/share/powershell /etc/mysql /etc/php
          sudo docker image prune -af >/dev/null 2>&1 || true

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Build food databases
        run: ./tools/fetch_food_data.sh

      - name: Remove raw food datasets
        run: rm -f tools/*.csv tools/*.csv.gz tools/fndds/*.csv

      - name: Patch health plugin for built-in Kotlin
        run: chmod +x tools/patch_health_plugin.sh && ./tools/patch_health_plugin.sh

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/macrotrack-release.jks
          cat > android/key.properties <<EOF
          storeFile=macrotrack-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - run: flutter pub get

      # Fresh build number every run, so Play always accepts the bundle even
      # when the version name is unchanged (e.g. 20260101.1).
      - name: Build app bundle (maintenance build number)
        run: flutter build appbundle --release --build-number="$(date -u +%Y%m%d)"

      - name: Bump version in pubspec.yaml and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD="$(date -u +%Y%m%d)"
          OLD_VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')"
          BASE="${OLD_VERSION%%+*}"
          sed -i '' -E "s/^version:.*/version: ${BASE}+${BUILD}/" pubspec.yaml 2>/dev/null \
            || sed -i -E "s/^version:.*/version: ${BASE}+${BUILD}/" pubspec.yaml
          git config user.name "maintenance-bot"
          git config user.email "actions@github.com"
          git add pubspec.yaml
          if git diff --cached --quiet; then echo "version unchanged"; exit 0; fi
          git commit -m "Maintenance build +${BUILD} (Play activity requirement)"
          git push origin HEAD:${{ github.ref_name }}
          git tag -a "v${BASE}+${BUILD}" -m "Maintenance build ${BUILD}" 2>/dev/null || true
          git push origin "v${BASE}+${BUILD}" 2>/dev/null || true
          # Pushing the tag triggers .github/workflows/release.yml, which
          # uploads the bundle to the internal track and attaches the APK.

      - name: Upload bundle directly to internal track (fallback)
        # Belt-and-braces: if the tag push above did not trigger a release
        # run (e.g. tag already existed), upload what this job just built.
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.trsonn.macrotrack
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
